baseURL: "/"
title: Hugo Arribas
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Research
          url: papers/
          weight: 2
        - name: Teaching
          url: courses/
          weight: 3
        - name: Talks
          url: talks/
          weight: 4
        - name: Referee
          url: service/
          weight: 5
        - name: CV
          url: cv/
          weight: 6
        - name: Contact
          url: contact/
          weight: 7

params:
    description: "Academic website of Hugo Arribas."
    author: Hugo Arribas
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","courses"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Hugo Arribas
          subtitle: "PhD Candidate at Instiut Mines-Télécom Business School (France). With research interests in digital economics, digital economics and public economics. Working under the supervision of pr. Grazia Cecere and pr. Vincent Lefrere. "
          imageUrl: "picture.jpeg"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Research
              url: papers/
            - name: Teaching
              url: courses/
            - name: Talks
              url: talks/
            - name: Referee
              url: service/
            - name: CV
              url: cv/
            - name: Contact
              url: contact/

    socialIcons:
        - name: CV
          url: cv/
        - name: linkedin
          url: https://fr.linkedin.com/in/hugo-arribas-243b22223
        - name: Email
          url: mailto:hugo.arribas@imt-bs.eu

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Hugo Arribas "
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
